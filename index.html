<body>
<canvas id="matrix" aria-hidden="true"></canvas>
<main class="wrap">
  
  <header class="topbar">
    <a class="brand-line brand-accueil" href="./" aria-label="Retour à l'accueil Geekotidien">
      <img src="geekotidien-logo.png" alt="" width="40" height="40">
      <span class="brand-name">Geekotidien</span>
    </a>
    <div class="socials">
      <a href="https://www.instagram.com/geekotidien/" target="_blank" rel="noopener" aria-label="Instagram Geekotidien" title="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/></svg>
      </a>
      <a href="https://www.tiktok.com/@geekotidien" target="_blank" rel="noopener" aria-label="TikTok Geekotidien" title="TikTok">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M14 3c.4 2.6 2.2 4.4 5 4.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </a>
      <a href="https://www.facebook.com/p/Geekotidien-61596425607773/" target="_blank" rel="noopener" aria-label="Facebook Geekotidien" title="Facebook">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8h2.5V4.5H14c-2.5 0-4 1.6-4 4.2V11H7.5v3.5H10V21h3.5v-6.5H16l.5-3.5h-3V8.7c0-.4.2-.7.5-.7z" fill="currentColor"/></svg>
      </a>
    </div>
  </header>
  <div class="intro">
        <p class="lede">Les news tech et geek du jour, du lundi au vendredi, sélectionnées chaque matin.</p>
  </div>
  <nav class="onglets" id="onglets" aria-label="Navigation"></nav>
  <div class="recherche-bloc">
    <input type="search" id="recherche" placeholder="Rechercher un mot (ex. TikTok, Claude)…" aria-label="Rechercher dans les news">
  </div>
  <section id="liste" aria-live="polite">
    <p class="empty">Chargement des news…</p>
  </section>
  <footer class="contact">
    <p>Une question, une erreur à signaler ?</p>
    <p><a class="partage-bouton" href="mailto:contact@geekotidien.fr">Nous écrire</a></p>
    <p class="contact-adresse"><span>contact@geekotidien.fr</span> <button type="button" id="copier-contact" class="partage-bouton">Copier l'adresse</button></p>
    <p><a class="partage-bouton" href="feed.xml">S'abonner au flux RSS</a></p>
    <p><a class="partage-bouton" href="mentions-legales.html">Mentions légales</a></p>
  </footer>
</main>
<dialog id="detail" aria-label="Détail de la news">
  <button type="button" id="detail-fermer" class="detail-close" aria-label="Fermer">×</button>
  <div id="detail-contenu"></div>
</dialog>
