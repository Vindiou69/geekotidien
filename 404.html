<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Page introuvable · Geekotidien</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .erreur{min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; padding-top:40px}
  .erreur img{width:95px; height:95px; border-radius:50%; box-shadow:0 0 0 3px var(--accent), 0 0 28px rgba(62,180,137,.45); animation:pop .6s cubic-bezier(.2,.8,.3,1.3) backwards}
  .erreur h1{font-size:clamp(48px, 14vw, 96px); line-height:1}
  .erreur h1::before, .erreur h1::after{content:none}
  .erreur h1 span{color:var(--accent); animation:glitch 1.6s steps(2) infinite}
  .erreur p{margin:0; color:var(--muted)}
  .erreur a{color:var(--accent); font-weight:700}
</style>
</head>
<body>
<canvas id="matrix" aria-hidden="true"></canvas>
<main class="wrap">
  <section class="erreur">
    <img src="geekotidien-logo.png" alt="Logo Geekotidien" width="95" height="95">
    <h1><span>404</span></h1>
    <p>Cette page n'existe pas.</p>
    <p><a href="./">Revenir à la dernière édition</a></p>
  </section>
</main>
<script src="matrix.js"></script>
</body>
</html>
